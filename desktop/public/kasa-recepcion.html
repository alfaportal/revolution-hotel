<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="/manifest-recepsion.json" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>Kasa recepsion — Revolution HOTEL</title>
  <script src="/js/pwa-staff-register.js" defer></script>
  <script src="/js/staff-auto-connect.js" defer></script>
  <style>html,body{background:#e8ecf1}</style>
  <style>
    :root {
      --bg: #0a1628;
      --bg-elevated: #0f2137;
      --card: #132238;
      --soft: #1a2d4a;
      --border: #243b5c;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #22d3ee;
      --ok: #22c55e;
      --danger: #ef4444;
      --radius: 12px;
      --radius-lg: 16px;
      --touch-min: 48px;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { height: 100%; margin: 0; overflow: hidden; }
    body {
      display: flex;
      flex-direction: column;
      min-height: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, "Segoe UI", sans-serif;
    }
    .ui-sr-check {
      position: fixed;
      opacity: 0;
      width: 1px;
      height: 1px;
      pointer-events: none;
      left: -9999px;
    }
    .top {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: .4rem .85rem;
      gap: .65rem;
      background: var(--bg-elevated);
      border-bottom: 1px solid var(--border);
      min-height: 48px;
    }
    .top-left { display: flex; align-items: center; gap: .65rem; flex-shrink: 0; }
    .top-logo { height: 36px; width: auto; max-width: 120px; object-fit: contain; }
    .top-kasa-link {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--text);
      text-decoration: none;
      letter-spacing: .03em;
    }
    .top-kasa-link:hover { color: var(--accent); }
    .top-bar-rest {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: .55rem;
    }
    .who {
      flex: 1 1 auto;
      min-width: 0;
      text-align: right;
      font-size: .76rem;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .who b { color: var(--text); }
    .kasa-btn-exit {
      min-width: 72px;
      min-height: 40px;
      padding: .4rem .85rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--danger);
      color: #fff;
      border-radius: 8px;
      font-weight: 700;
      font-size: .88rem;
      border: none;
      cursor: pointer;
      font-family: inherit;
      text-decoration: none;
    }
    .wrap {
      flex: 1 1 auto;
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 7fr) minmax(0, 3fr);
      gap: 0;
      overflow: hidden;
    }
    .card {
      min-height: 0;
      height: 100%;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .col-cart {
      position: relative;
      background: linear-gradient(180deg, #121c30 0%, #0f172a 100%);
      padding: .65rem .75rem;
      border-right: 1px solid var(--border);
    }
    .col-cart .kasa-module-nav {
      margin: -.65rem -.75rem .5rem;
      padding: .45rem .75rem;
    }
    .kasa-work-host {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .kasa-cart-pane {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    .col-cart.is-module-open .kasa-cart-pane {
      display: none !important;
    }
    .kasa-cart-pane:not(.has-lines) {
      display: none !important;
    }
    .checkout-panel { display: flex; flex-direction: column; min-height: 0; flex: 1; }
    .cart-header { text-align: center; flex-shrink: 0; margin-bottom: .5rem; }
    .cart-header .basket-label {
      display: block;
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: .06em;
      text-transform: uppercase;
    }
    .cart-head-meta {
      display: block;
      margin-top: .25rem;
      font-size: .85rem;
      color: var(--accent);
      font-weight: 600;
    }
    #scan {
      width: 100%;
      max-width: 720px;
      margin: .5rem auto .65rem;
      display: block;
      padding: .85rem 1rem;
      font-size: 1.05rem;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      background: var(--bg-elevated);
      color: var(--text);
      text-align: center;
    }
    #scan:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(34, 211, 238, .2);
    }
    .checkout-mid {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: .5rem;
    }
    .sale-list {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg-elevated);
    }
    .cart-list { display: flex; flex-direction: column; margin: 0; padding: 0; }
    .cart-empty-inline {
      color: var(--muted);
      text-align: center;
      padding: 2rem 1rem;
      font-size: .95rem;
    }
    .cart-row {
      display: grid;
      grid-template-columns: 1fr auto auto auto;
      gap: .5rem .65rem;
      align-items: center;
      padding: .75rem .85rem;
      border-bottom: 1px solid var(--border);
      font-size: .88rem;
    }
    .cart-row:last-child { border-bottom: none; }
    .cart-row.flash-line { animation: lineflash .7s ease; background: rgba(34, 211, 238, .08); }
    @keyframes lineflash {
      0% { background: rgba(249, 115, 22, .25); }
      100% { background: transparent; }
    }
    .cart-name-cell { font-weight: 600; line-height: 1.35; min-width: 0; }
    .cart-qty-cell { display: inline-flex; align-items: center; gap: 4px; }
    .cart-qty-cell .qty {
      width: 4rem;
      padding: .35rem;
      font-size: .88rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--soft);
      color: var(--text);
    }
    .cart-price-cell { white-space: nowrap; font-weight: 800; color: var(--accent); }
    .cart-table [data-act="lpv"] {
      outline: none;
      border-bottom: 1px dashed currentColor;
      min-width: 2.4rem;
      display: inline-block;
      cursor: text;
      font-weight: 800;
    }
    .cart-row button.cart-rm, .cart-row button.qty-btn {
      min-width: var(--touch-min);
      min-height: var(--touch-min);
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--soft);
      color: var(--text);
      font-weight: 800;
      cursor: pointer;
    }
    .cart-row button.cart-rm { background: rgba(239, 68, 68, .15); color: #fecaca; font-size: 1.1rem; }
    .cart-totals-block {
      flex-shrink: 0;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--card);
      overflow: hidden;
    }
    .cart-total-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: .85rem 1rem;
      background: linear-gradient(90deg, #0f2840 0%, #132238 100%);
    }
    .cart-total-label {
      font-size: .8rem;
      font-weight: 800;
      letter-spacing: .05em;
      text-transform: uppercase;
    }
    #total { font-size: 1.75rem; font-weight: 900; color: var(--accent); }
    .kasa-module-nav {
      flex-shrink: 0;
      background: var(--bg-elevated);
      border-bottom: 1px solid var(--border);
      position: relative;
      z-index: 12;
    }
    .main-cat-bar {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: .45rem;
      flex-shrink: 0;
      margin: 0;
    }
    .main-cat-bar button {
      min-height: var(--touch-min);
      padding: .55rem .4rem;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: linear-gradient(180deg, #1e3a5f, #172554);
      color: #e0f2fe;
      font-weight: 800;
      font-size: .78rem;
      cursor: pointer;
      font-family: inherit;
    }
    .main-cat-bar button.on {
      background: linear-gradient(180deg, #ff7a45, #ea580c);
      border-color: #fb923c;
      color: #fff;
    }
    .main-cat-bar button .recep-pending-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 1.15rem;
      height: 1.15rem;
      margin-left: .35rem;
      padding: 0 .3rem;
      border-radius: 999px;
      background: #dc2626;
      color: #fff;
      font-size: .68rem;
      font-weight: 900;
      line-height: 1;
      vertical-align: middle;
      animation: recep-badge-pulse 1.2s ease-in-out infinite;
    }
    @keyframes recep-badge-pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }
    .recep-module-pane {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #eef2f7;
      border-radius: var(--radius);
    }
    .recep-module-pane[hidden] { display: none !important; }
    .recep-module-frame {
      flex: 1;
      min-height: 0;
      width: 100%;
      border: 0;
      background: #fff;
    }
    .svc-cat-grid-rc {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(158px, 1fr));
      gap: .75rem;
      max-width: 1200px;
      margin: 0 auto;
      padding-bottom: 1rem;
    }
    .svc-card-rc {
      display: flex;
      flex-direction: column;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #e2e8f0;
      background: #fff;
      cursor: pointer;
      font: inherit;
      text-align: left;
      min-height: 168px;
      padding: 0;
    }
    .svc-card-rc:active { transform: scale(0.98); }
    .svc-card-rc .svc-card-photo-wrap {
      width: 100%;
      aspect-ratio: 4 / 3;
      background: #e2e8f0;
      overflow: hidden;
    }
    .svc-card-rc .svc-card-photo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .svc-card-rc .svc-card-body {
      padding: .65rem .7rem .75rem;
      display: flex;
      flex-direction: column;
      flex: 1;
      gap: .2rem;
    }
    .svc-card-rc .svc-card-name { font-weight: 800; color: #0f172a; font-size: .9rem; line-height: 1.25; }
    .svc-card-rc .svc-card-price { font-weight: 800; color: #0f766e; font-size: .9rem; margin-top: auto; }
    .svc-card-rc .svc-card-mode { font-size: .68rem; font-weight: 700; color: #64748b; }
    .cart-table-wrap {
      flex: 1;
      min-height: 0;
      overflow: auto;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg-elevated);
    }
    table.cart-table {
      width: 100%;
      border-collapse: collapse;
      font-size: .88rem;
    }
    table.cart-table thead th {
      position: sticky;
      top: 0;
      background: #0f2840;
      color: var(--text);
      font-weight: 800;
      text-align: left;
      padding: .6rem .65rem;
      border-bottom: 1px solid var(--border);
    }
    table.cart-table tbody td {
      padding: .55rem .65rem;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }
    table.cart-table tbody tr:last-child td { border-bottom: none; }
    table.cart-table .cart-empty td {
      text-align: center;
      color: var(--muted);
      padding: 2rem .65rem;
    }
    .cart-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: .45rem;
      flex-shrink: 0;
      margin-top: .45rem;
    }
    .cart-action-btn {
      min-height: var(--touch-min);
      border: none;
      border-radius: var(--radius);
      font-weight: 800;
      font-size: .82rem;
      cursor: pointer;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: .5rem .35rem;
      color: #e0f2fe;
      background: linear-gradient(180deg, #1e3a5f, #172554);
      border: 1px solid #38bdf866;
    }
    .cart-action-hint {
      background: var(--soft);
      color: var(--muted);
      border: 1px dashed var(--border);
      cursor: default;
      font-weight: 600;
      font-size: .72rem;
    }
    label.cart-action-cat { margin: 0; }

    .col-pay.market-checkout-panel {
      background: #0f172a66;
      padding: .45rem .5rem .4rem;
      border-left: 1px solid #2d3f5c;
    }
    .col-pay.market-checkout-panel .checkout-head { margin-bottom: .35rem; }
    .col-pay.market-checkout-panel .basket-label {
      font-size: .72rem;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: #cbd5e1;
    }
    .col-pay.market-checkout-panel .checkout-mid {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      gap: 6px;
    }
    .col-pay.market-checkout-panel .pay-method-card {
      display: grid;
      grid-template-columns: 24px minmax(0, 1fr) 72px;
      gap: 6px;
      align-items: center;
      width: 100%;
      padding: 8px;
      border: 1px solid #2d3f5c;
      border-radius: 8px;
      background: #111827;
      color: #f1f5f9;
      cursor: pointer;
      text-align: left;
      font: inherit;
      min-height: 44px;
    }
    .col-pay.market-checkout-panel .pay-method-card.on {
      border-color: #22c55e88;
      background: rgba(34, 197, 94, 0.12);
    }
    .col-pay.market-checkout-panel .pay-method-card .pay-method-check {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 1px solid #2d3f5c;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: .72rem;
      color: transparent;
    }
    .col-pay.market-checkout-panel .pay-method-card.on .pay-method-check {
      border-color: #22c55e;
      background: #22c55e;
      color: #052e16;
      font-weight: 900;
    }
    .col-pay.market-checkout-panel .pay-method-card .pay-method-label {
      font-size: 0.78rem;
      font-weight: 650;
    }
    .col-pay.market-checkout-panel .pay-method-card .pay-checkout-amt {
      width: 100%;
      margin: 0;
      padding: 4px 6px;
      font-size: 0.78rem;
      height: 30px;
      text-align: right;
      background: #111827;
      border: 1px solid #2d3f5c;
      color: #f1f5f9;
      border-radius: 8px;
    }
    .col-pay.market-checkout-panel .pay-cash-box {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      padding: 8px;
      border: 1px solid #2d3f5c;
      border-radius: 8px;
      background: #111827;
    }
    .col-pay.market-checkout-panel .pay-cash-box label {
      display: block;
      font-size: 0.65rem;
      font-weight: 800;
      color: #94a3b8;
      margin-bottom: 4px;
    }
    .col-pay.market-checkout-panel .pay-cash-box input {
      width: 100%;
      font-size: 1.1rem;
      font-weight: 800;
      height: 40px;
      padding: 6px 8px;
      background: #111827;
      border: 1px solid #2d3f5c;
      color: #f1f5f9;
      border-radius: 8px;
    }
    .col-pay.market-checkout-panel .pay-change-val {
      font-size: 1.35rem;
      font-weight: 900;
      color: #4ade80;
      min-height: 40px;
      display: flex;
      align-items: center;
    }
    .col-pay.market-checkout-panel .pay-change-val.zero { color: #94a3b8; font-size: 1rem; }
    .col-pay.market-checkout-panel .checkout-foot {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
      border-top: 1px solid #2d3f5c;
      padding-top: .4rem;
    }
    .col-pay.market-checkout-panel .checkout-pay-shortcuts {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
    }
    .col-pay.market-checkout-panel .btn-pay-quick {
      min-height: var(--touch-min);
      padding: 10px 8px;
      font-size: 0.88rem;
      font-weight: 800;
      border: 1px solid #2d3f5c;
      border-radius: 8px;
      cursor: pointer;
      font-family: inherit;
      background: linear-gradient(180deg, #1e3a5f, #172554);
      color: #e0f2fe;
    }
    .col-pay.market-checkout-panel .checkout-pay-actions .btn {
      min-height: var(--touch-min);
      padding: 10px 8px;
      font-size: 0.88rem;
      font-weight: 800;
      border-radius: 8px;
      width: 100%;
      cursor: pointer;
      font-family: inherit;
      border: none;
    }
    .col-pay.market-checkout-panel #btn-paguaj-nopaper,
    .btn-pay-nopaper {
      background: #0369a1;
      color: #f0f9ff;
      border: none;
    }
    #modal-pos-coupon[hidden] { display: none !important; }
    #modal-pos-coupon {
      position: fixed;
      inset: 0;
      z-index: 20000;
      background: rgba(15, 23, 42, 0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    #modal-pos-coupon .pos-coupon-card {
      background: #fff;
      color: #0f172a;
      width: min(420px, 100%);
      max-height: 90vh;
      overflow: auto;
      border-radius: 12px;
      padding: 1rem;
    }
    #modal-pos-coupon pre {
      white-space: pre-wrap;
      font-family: ui-monospace, Consolas, monospace;
      font-size: 0.78rem;
      background: #f8fafc;
      padding: 0.6rem;
      border-radius: 8px;
    }
    #modal-pos-coupon img { display: block; margin: 0.5rem auto; width: 180px; height: 180px; }
    .col-pay.market-checkout-panel #btn-paguaj {
      background: linear-gradient(180deg, #4ade80, #16a34a);
      color: #052e16;
    }
    .col-pay.market-checkout-panel #btn-clear-cart {
      background: #1a2740;
      color: #f1f5f9;
      border: 1px solid #2d3f5c;
    }
    .col-pay.market-checkout-panel #btn-kupon-termik {
      background: linear-gradient(180deg, #38bdf8, #0284c7);
      color: #0c4a6e;
    }
    .col-pay.market-checkout-panel .checkout-pay-actions {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .kasa-table-modal {
      position: fixed;
      inset: 0;
      z-index: 12000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .kasa-table-modal-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
    }
    .kasa-table-modal-content {
      position: relative;
      z-index: 1;
      width: min(420px, 100%);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1.25rem 1.1rem;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
    }
    .kasa-table-modal-content h2 {
      margin: 0;
      font-size: 1.15rem;
    }
    #modal-kasa-post-pay-thermal .btn-coupon-thermal {
      width: 100%;
      min-height: var(--touch-min);
      font-weight: 800;
      border: none;
      border-radius: 10px;
      padding: 0.75rem;
      font-size: 0.92rem;
      cursor: pointer;
      background: linear-gradient(180deg, #38bdf8, #0284c7);
      color: #0c4a6e;
      font-family: inherit;
    }
    #modal-kasa-post-pay-thermal .btn-kasa-vazhdo {
      width: 100%;
      min-height: var(--touch-min);
      font-weight: 800;
      border: none;
      border-radius: 10px;
      padding: 0.75rem;
      font-size: 0.92rem;
      cursor: pointer;
      background: linear-gradient(180deg, #4ade80, #16a34a);
      color: #052e16;
      font-family: inherit;
    }
    #kasa-post-pay-thermal-msg {
      margin-top: 0.75rem;
      padding: 0.5rem 0.65rem;
      border-radius: 8px;
      font-size: 0.82rem;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #fecaca;
    }
    .print-receipt { display: none; }
    @media print {
      body * { visibility: hidden !important; }
      #print-fature, #print-fature * { visibility: visible !important; }
      #print-fature {
        display: block !important;
        position: absolute;
        left: 50%;
        top: 0;
        transform: translateX(-50%);
        width: 100%;
        max-width: 300px;
        padding: 16px;
        font-family: "Courier New", monospace;
        font-size: 11pt;
        color: #000;
      }
    }

  <script src="/js/app.js?v=13"></script>
  <script src="/js/order-alarm-sound.js?v=2"></script>
  <script src="/js/staff-order-alert.js?v=2"></script>
  <script src="/js/fiscal-offline-status.js?v=3"></script>
  <script>
    (function guardRecepsionSession() {
      const u = typeof lexoSesionin === "function" ? lexoSesionin() : null;
      if (!u || u.roli !== "recepsion" || !u.token) {
        if (typeof shfaqHyrjenTani === "function") shfaqHyrjenTani("/login.html?hub=1");
        else window.location.replace("/login.html?hub=1");
        return;
      }
      if (typeof ruajSesionin === "function") ruajSesionin(u);
      window.__recepUser = u;
    })();

    const user = window.__recepUser;
    if (user && user.token) {
    function dilNgaKasa() {
      const frame = document.getElementById("recep-module-frame");
      if (frame) {
        try { frame.src = "about:blank"; } catch { /* iframe */ }
      }
      if (typeof dil === "function") dil();
      else if (typeof shfaqHyrjenTani === "function") shfaqHyrjenTani("/login.html?hub=1");
      else window.location.replace("/login.html?hub=1");
    }
    document.getElementById("btn-kasa-dil")?.addEventListener("click", dilNgaKasa);
    document.getElementById("btn-top-recep-rooms")?.addEventListener("click", () => {
      openRecepModule("rooms");
    });
    const RECEP_MODULES = [
      { id: "rooms", label: "Dhomat" },
      { id: "reservations", label: "Rezervimet" },
      { id: "services", label: "Shërbimet" },
      { id: "housekeeping", label: "Pastrimi" },
      { id: "orders", label: "Porositë" },
    ];

    let catalog = { groups: [], services: [], categories: [] };
    let servicesById = new Map();
    let cart = [];
    let shiftSummary = null;
    let activeRecepView = null;
    let primaryPay = "cash";
    let multiPay = false;
    let paperBlockActive = false;
    let recepPendingOrderCount = 0;
    let kasaPostPayCtx = null;

    function euro(n) {
      return (Math.round((Number(n) || 0) * 100) / 100).toFixed(2) + " €";
    }

    function servicePrice(svc) {
      const p = svc?.price ?? svc?.default_price ?? svc?.unit_price;
      const n = Number(p) || 0;
      return Math.round(n * 10000) / 10000;
    }

    function formatKasaUnit(n) {
      const x = Number(n);
      if (!Number.isFinite(x)) return "0.00";
      const r = Math.round(x * 10000) / 10000;
      const s = r.toFixed(4);
      if (s.endsWith("0000")) return r.toFixed(2);
      return s.replace(/0+$/, "").replace(/\.$/, "");
    }

    function parseKasaUnit(raw) {
      const n = Number(String(raw || "").replace(",", ".").replace(/[^\d.]/g, ""));
      if (!Number.isFinite(n) || n < 0) return null;
      return Math.round(n * 10000) / 10000;
    }

    function applyKasaUnitPrice(idx, raw) {
      const p = parseKasaUnit(raw);
      if (p == null || !cart[idx]) return;
      cart[idx].price = p;
    }

    function commitKasaPriceEdits() {
      document.querySelectorAll("#cart-tbody [data-act=lpv]").forEach((el) => {
        applyKasaUnitPrice(Number(el.dataset.idx), el.textContent);
      });
    }

    function bindKasaPriceEdits() {
      document.querySelectorAll("#cart-tbody [data-act=lpv]").forEach((el) => {
        el.addEventListener("focus", () => {
          const r = document.createRange();
          r.selectNodeContents(el);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(r);
        });
        el.addEventListener("keydown", (e) => {
          if (e.key === "Enter") {
            e.preventDefault();
            el.blur();
          }
          if (e.key === "Escape") {
            e.preventDefault();
            const i = +el.dataset.idx;
            el.textContent = formatKasaUnit(cart[i]?.price);
            el.blur();
          }
        });
        el.addEventListener("blur", () => {
          const i = +el.dataset.idx;
          if (!cart[i]) return;
          applyKasaUnitPrice(i, el.textContent);
          el.textContent = formatKasaUnit(cart[i].price);
          const row = el.closest("tr");
          const tot = row?.querySelector("[data-act=lpt]");
          if (tot) tot.textContent = euro(cart[i].price * cart[i].qty);
          document.getElementById("total").textContent = euro(payable());
          syncPayAmounts();
          updateChange();
        });
      });
    }

    function cartTotal() {
      return cart.reduce((s, l) => s + l.price * l.qty, 0);
    }

    function payable() {
      return Math.round(cartTotal() * 100) / 100;
    }

    function renderCart() {
      const tbody = document.getElementById("cart-tbody");
      const t = payable();
      document.getElementById("total").textContent = euro(t);
      const col = document.getElementById("col-cart");
      const pane = document.getElementById("kasa-cart-pane");
      const hasLines = cart.length > 0;
      col?.classList.toggle("has-cart-lines", hasLines);
      pane?.classList.toggle("has-lines", hasLines);
      if (!cart.length) {
        tbody.innerHTML = '<tr class="cart-empty"><td colspan="4">Lista është bosh — zgjidh shërbim ose shto nga dhoma.</td></tr>';
        syncPayAmounts(t);
        updateChange();
        return;
      }
      tbody.innerHTML = cart.map((l, idx) => `
        <tr data-idx="${idx}">
          <td>${esc(l.name)}</td>
          <td>
            <button type="button" class="qty-btn" data-act="minus" data-idx="${idx}">−</button>
            <input class="qty" type="number" min="1" max="99" value="${l.qty}" data-idx="${idx}" style="width:3rem;margin:0 .25rem" />
            <button type="button" class="qty-btn" data-act="plus" data-idx="${idx}">+</button>
          </td>
          <td class="cart-price-cell">${l.qty} × <span data-act="lpv" data-idx="${idx}" contenteditable="true" spellcheck="false">${formatKasaUnit(l.price)}</span> €<br><span data-act="lpt">${euro(l.price * l.qty)}</span></td>
          <td><button type="button" class="cart-rm" data-idx="${idx}" aria-label="Hiq">×</button></td>
        </tr>`).join("");
      bindKasaPriceEdits();
      syncPayAmounts(t);
      updateChange();
    }

    function esc(s) {
      return String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");
    }

    function addServiceToCart(svc, qty = 1) {
      commitKasaPriceEdits();
      if (!svc || !svc.id) return;
      const price = servicePrice(svc);
      if (price <= 0) {
        document.getElementById("msg").textContent = "Shërbimi nuk ka çmim.";
        return;
      }
      const id = Number(svc.id);
      const existing = cart.find((l) => l.service_id === id);
      if (existing) existing.qty += qty;
      else cart.push({
        service_id: id,
        name: svc.name || "Shërbim",
        price,
        qty: Math.max(1, qty),
        vat_category: svc.vat_category || "18",
      });
      renderCart();
    }

    function recepModuleUrl(view) {
      const v = RECEP_MODULES.some((m) => m.id === view) ? view : "rooms";
      return `/recepcion.html?view=${encodeURIComponent(v)}&embed=kasa`;
    }

    function pushRecepSessionIntoFrame() {
      const frame = document.getElementById("recep-module-frame");
      if (!frame?.contentWindow || !user?.token) return;
      try {
        frame.contentWindow.postMessage(
          { type: "recep-embed-session", user },
          window.location.origin,
        );
      } catch {
        /* cross-origin / not ready */
      }
    }

    function frameHasRecepModuleLoaded(frame) {
      try {
        const src = String(frame?.src || "");
        return src.includes("/recepcion.html") && src.includes("embed=kasa");
      } catch {
        return false;
      }
    }

    let recepEmbedReloadGuard = 0;

    function openRecepModule(view) {
      if (!RECEP_MODULES.some((m) => m.id === view)) view = "rooms";
      if (activeRecepView === view) return;
      activeRecepView = view;
      renderCategoryNav();
      const col = document.getElementById("col-cart");
      const pane = document.getElementById("recep-module-pane");
      const frame = document.getElementById("recep-module-frame");
      col?.classList.add("is-module-open");
      pane.hidden = false;
      if (frameHasRecepModuleLoaded(frame)) {
        pushRecepSessionIntoFrame();
        try {
          frame.contentWindow?.postMessage({ type: "recep-set-view", view }, window.location.origin);
        } catch {
          /* iframe */
        }
        return;
      }
      const onFrameReady = () => {
        recepEmbedReloadGuard = 0;
        pushRecepSessionIntoFrame();

      const el = document.getElementById("pay-change");
      el.textContent = euro(ch);

      document.querySelectorAll(".pay-method-card").forEach((card) => {

        card.querySelector(".pay-method-check").textContent = on ? "✓" : "";
      });

    function enableMultiPay() {
      multiPay = true;
      document.querySelectorAll(".pay-method-card").forEach((card) => {
        card.classList.add("on");

    function updateMixedStatus() {
      const t = payable();
      const status = document.getElementById("pay-mixed-status");
      if (!multiPay) {
        status.classList.add("hidden");
        return;
      }
      status.classList.remove("hidden");
      let sum = 0;
      const splits = [];
      document.querySelectorAll(".pay-checkout-amt").forEach((inp) => {
        const amt = Math.round((Number(inp.value) || 0) * 100) / 100;
        if (amt > 0) splits.push({ id: inp.dataset.payId, amt });
        sum += amt;
      });
      sum = Math.round(sum * 100) / 100;
      const ok = Math.abs(sum - t) < 0.01;
      status.textContent = ok
        ? `Shuma e metodave: ${euro(sum)}`
        : `Shuma ${euro(sum)} ≠ totali ${euro(t)}`;
      status.classList.toggle("mismatch", !ok);
      return { ok, splits, sum };
    }

    function buildPaymentPayload() {
      const t = payable();
      if (multiPay) {
        const m = updateMixedStatus();
        if (!m?.ok) throw new Error("Rregulloni shumat e metodave të pagesës.");
        const splits = m.splits.map((s) => ({ method: s.id, amount: s.amt }));
        return { payment_method: "mixed", payment_splits: splits };
      }
      if (primaryPay === "cash") {
        const given = Number(document.getElementById("pay-received").value) || 0;
        if (given + 0.001 < t) throw new Error("Pagesa e pranuar është më e vogël se totali.");
      }
      return { payment_method: primaryPay, payment_splits: null };
    }

    async function paySale(opts = {}) {
      commitKasaPriceEdits();
      const thermal = opts.thermal === true;
      const skipPrint = opts.skipPrint === true;
      const msg = document.getElementById("msg");
      const btnPay = document.getElementById("btn-paguaj");
      const btnNoPaper = document.getElementById("btn-paguaj-nopaper");
      const btnTermik = document.getElementById("btn-kupon-termik");
      if (!shiftSummary?.open) {
        msg.textContent = "Hap ndërrimin në recepsion para shitjes.";
        return;
      }
      if (!cart.length) {
        msg.textContent = "Shtoni të paktën një shërbim.";
        return;
      }
      let payPayload;
      try {
        payPayload = buildPaymentPayload();
      } catch (e) {
        msg.textContent = e.message || "Gabim pagese";
        return;
      }
      msg.textContent = thermal ? "Duke paguar dhe printuar termik…" : "Duke regjistruar…";
      if (btnPay) btnPay.disabled = true;
      if (btnNoPaper) btnNoPaper.disabled = true;
      if (btnTermik) btnTermik.disabled = true;
      try {
        const items = cartItemsForCheckout();
        const base = {
          items,
          ...payPayload,
          operator_name: user.emri || "Recepsion",
          recepcion_kasa: true,
        };

        if (!thermal && paperBlockActive) {
          let serialNo = null;
          let blockCode = null;
          while (true) {
            const entered = window.prompt(
              "Numri serik i kuponit (obligativ para pagesës):",
              ""
            );
            if (entered === null) {
              msg.textContent = "Pagesa u anulua — mungon numri serik i kuponit.";
              return;
            }
            serialNo = String(entered).trim();
            if (serialNo) break;
            msg.textContent = "Numri serik i kuponit është i detyrueshëm.";
          }
          while (true) {
            const enteredBlock = window.prompt(
              "Kodi unik i bllokut (si në fletën ATK):",
              "BLK-2026-01"
            );
            if (enteredBlock === null) {
              msg.textContent = "Pagesa u anulua — mungon kodi unik i bllokut.";
              return;
            }
            blockCode = String(enteredBlock).trim();
            if (blockCode) break;
            msg.textContent = "Kodi unik i bllokut është i detyrueshëm.";
          }
          base.serial_no = serialNo;
          base.block_code = blockCode;
          if (skipPrint) base.skip_print = true;
          let res = await api("/api/fiscal/paper-block/checkout", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ ...base, confirmed_over_1000: false }),
          });
          if (res.needs_confirm_over_1000) {
            const ok = window.confirm(
              `Totali është ${euro(res.total)} (mbi 1000 €).\nKonfirmoni finalizimin e transaksionit?`
            );
            if (!ok) {
              msg.textContent = "Anuluar — mbi 1000€ pa konfirmim";
              return;
            }
            res = await api("/api/fiscal/paper-block/checkout", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ ...base, confirmed_over_1000: true }),
            });
          }
          const p = res.paper || {};
          if (skipPrint) {
            showKasaCouponPreview({ print_text: p.slip_text || "" });
            msg.textContent = `Bllok letër · ${euro(res.total)} · serik ${p.serial_no || serialNo} · pa letër`;
          } else {
          msg.textContent =
            `Bllok letër · ${euro(res.total)} · serik ${p.serial_no || serialNo}` +
            (p.slip_text ? " · print u nis" : " · ruajtur lokalisht, dërgohet te ATK kur lidhet");
          }
          cart = [];
          setPrimaryPay("cash");
          document.getElementById("pay-received").value = "";
          renderCart();
          await loadShift();
          await refreshPaperBlockKasaUi();
          return;
        }

        const res = await api("/api/recepcion/kasa/pay", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ ...base, print_thermal: thermal, skip_print: skipPrint }),
        });

        if (thermal) {
          applyKasaThermalPrintResult(res, null);
          msg.textContent = `Pagesa u krye · ${euro(res.total)} · ${res.receipt_number}`;
          showKasaPostPayThermalModal({
            result: res,
            reprintBody: {
              receipt_number: res.receipt_number,
              total: res.total,
              payment_method: res.payment_method,
              items,
            },
          });
        } else if (skipPrint) {
          showKasaCouponPreview(res.fiscal_receipt);
          msg.textContent = `U regjistrua ${euro(res.total)} · ${res.receipt_number} · pa letër`;
          cart = [];
          setPrimaryPay("cash");
          document.getElementById("pay-received").value = "";
          renderCart();
          await loadShift();
          await refreshPaperBlockKasaUi();
        } else {
          let line = `U regjistrua ${euro(res.total)} · ${res.receipt_number}`;
          if (res.fiscal_printed) line += " · kupon fiskal";
          else if (res.fiscal_receipt?.printMessage) line += " · " + res.fiscal_receipt.printMessage;
          msg.textContent = line;
          if (res.coupon_type === "fiscal" && !res.fiscal_printed && res.printMessage) {
            alert(`Kuponi fiskal NUK u printua.\n\n${res.printMessage}\n\nPagesa u regjistrua në ditari.`);
          }
          cart = [];
          setPrimaryPay("cash");
          document.getElementById("pay-received").value = "";
          renderCart();
          await loadShift();
          await refreshPaperBlockKasaUi();
        }
      } catch (e) {
        msg.textContent = e.message || "Gabim";
      } finally {
        if (btnPay) btnPay.disabled = false;
        if (btnNoPaper) btnNoPaper.disabled = false;
        if (btnTermik) btnTermik.disabled = false;
      }
    }

    document.getElementById("btn-recep-z-report").onclick = async function zReportKasaRecep() {
      const btn = this;
      const op = String(user?.emri || "Recepsion").trim();
      if (!window.confirm(`Raporti Z — mbyll ditën fiskale?\nOperator: ${op}\n\nVazhdoni?`)) return;
      const prev = btn.textContent;
      btn.disabled = true;
      btn.textContent = "…";
      try {
        const data = await api("/api/staff/fiscal/z-report", {
          method: "POST",
          body: JSON.stringify({ operator_name: op }),
        });
        const printInfo = data.printed ? "Printuar." : (data.printMessage || "Printimi nuk u bë.");
        window.alert(`Raporti Z u gjenerua.\n${printInfo}`);
        await loadShift();
      } catch (err) {
        window.alert(err.message || "Raporti Z dështoi.");
      } finally {
        btn.disabled = false;
        btn.textContent = prev;
      }
    };

    (async function init() {
      try {
        await loadCatalog();
        await loadShift();
        await refreshPaperBlockKasaUi();
        setInterval(() => refreshPaperBlockKasaUi().catch(() => {}), 60000);
        setPrimaryPay("cash");
        renderCart();
        renderCategoryNav();
        if (typeof initAtkTimeSyncUi === "function") initAtkTimeSyncUi();
      } catch (e) {
        document.getElementById("msg").textContent = e.message || "Gabim ngarkimi";
      }
    })();
    }
  </script>
  <div id="modal-pos-coupon" hidden>
    <div class="pos-coupon-card" role="dialog" aria-modal="true" aria-labelledby="pos-coupon-title">
      <h2 id="pos-coupon-title" style="margin:0 0 0.4rem;font-size:1.05rem">Kuponi</h2>
      <pre id="pos-coupon-text"></pre>
      <img id="pos-coupon-qr" alt="QR" hidden>
      <p id="pos-coupon-email-msg" style="min-height:1.2rem;margin:0.4rem 0"></p>
      <div style="display:flex;gap:0.5rem">
        <button type="button" class="btn btn-pay-nopaper" id="btn-pos-coupon-email" hidden>Dërgo email</button>
        <button type="button" class="btn" id="btn-pos-coupon-close">Mbyll</button>
      </div>
    </div>
  </div>
</body>
</html>
