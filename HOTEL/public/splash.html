<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Revolution HOTEL</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #0b1220;
      color: #f8fafc;
      font-family: "Segoe UI", system-ui, sans-serif;
      overflow: hidden;
      user-select: none;
    }
    .wrap {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
    }
    img {
      width: 88px;
      height: 88px;
      object-fit: contain;
      border-radius: 18px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
    }
    h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 0.04em;
    }
    p {
      margin: 0;
      color: #94a3b8;
      font-size: 14px;
    }
    .spin {
      width: 28px;
      height: 28px;
      border: 3px solid #1e293b;
      border-top-color: #fbbf24;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="wrap">
    <img src="img/revolution-logo.png" alt="Revolution HOTEL" onerror="this.style.display='none'">
    <h1>Revolution HOTEL</h1>
    <p>Duke u hapur…</p>
    <div class="spin" aria-hidden="true"></div>
  </div>
</body>
</html>
