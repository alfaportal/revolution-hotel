<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shërbimet — Hotel</title>
  <style>
    :root { --bg:#0f172a; --card:#1e293b; --txt:#f1f5f9; --muted:#94a3b8; --acc:#FF6B35; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--txt); padding:1rem; }
    h1 { font-size:1.35rem; margin:0 0 0.35rem; }
    .sub { color:var(--muted); margin:0 0 1rem; font-size:0.9rem; }
    .cat { color:var(--acc); font-weight:700; margin:1.1rem 0 0.45rem; font-size:0.85rem; display:flex; align-items:center; gap:0.5rem; }
    .cat-photo { width:2rem; height:2rem; object-fit:cover; border-radius:6px; flex:none; }
    .item { display:flex; justify-content:space-between; gap:1rem; padding:0.65rem 0.75rem; background:var(--card); border-radius:10px; margin-bottom:0.45rem; }
    .price { color:var(--acc); font-weight:700; white-space:nowrap; }
    .err { color:#fca5a5; }
  </style>
</head>
<body>
  <h1 id="title">Shërbimet</h1>
  <p class="sub">Lista e shërbimeve me çmime</p>
  <div id="list">Duke ngarkuar…</div>
  <script>
    (async () => {
      const list = document.getElementById("list");
      try {
        const r = await fetch("/api/guest/services");
        const d = await r.json();
        if (!r.ok) throw new Error(d.gabim || "Gabim");
        document.getElementById("title").textContent = (d.hotel_name || "Hotel") + " — Shërbime";
        const groups = d.groups || [];
        if (!groups.length && !(d.services || []).length) {
          list.innerHTML = "<p class='err'>Nuk ka shërbime.</p>";
          return;
        }
        if (groups.length) {
          list.innerHTML = groups.map((g) =>
            `<div class="cat">` + (g.photo ? `<img class="cat-photo" src="${g.photo}" alt="">` : "") + `<span>${g.name || "Të tjera"}</span></div>` +
            (g.services || []).map((s) =>
              `<div class="item"><span>${s.name}</span><span class="price">${Number(s.price).toFixed(2)} €</span></div>`
            ).join("")
          ).join("");
        } else {
          list.innerHTML = (d.services || []).map((s) =>
            `<div class="item"><span>${s.name}</span><span class="price">${Number(s.price).toFixed(2)} €</span></div>`
          ).join("");
        }
      } catch (e) {
        list.innerHTML = `<p class="err">${e.message || "Gabim"}</p>`;
      }
    })();
  </script>
</body>
</html>
