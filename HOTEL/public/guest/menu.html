<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Menyja — Hotel</title>
  <link rel="stylesheet" href="/guest/guest-menu.css">
  <style>
    :root { --bg:#0f172a; --txt:#f1f5f9; --muted:#94a3b8; --acc:#FF6B35; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--txt); padding:1rem 1rem 6rem; }
    h1 { font-size:1.35rem; margin:0 0 0.35rem; }
    .sub { color:var(--muted); margin:0 0 1rem; font-size:0.9rem; }
    .err { color:#fca5a5; } .ok { color:#86efac; }
    .bar { position:fixed; left:0; right:0; bottom:0; background:#111827; border-top:1px solid #334155; padding:0.75rem 1rem; display:flex; flex-direction:column; gap:0.5rem; z-index:40; }
    .bar-row { display:flex; gap:0.5rem; align-items:center; }
    .bar-row input { flex:1; padding:0.45rem 0.55rem; border-radius:8px; border:1px solid #334155; background:#0f172a; color:#f1f5f9; }
    .bar-row strong { flex:1; }
    .bar-row button { background:var(--acc); color:#fff; border:0; border-radius:10px; padding:0.65rem 1rem; font-weight:800; cursor:pointer; }
  </style>
</head>
<body>
  <h1 id="title">Menyja</h1>
  <p class="sub" id="sub">Restoranti / Bari</p>
  <p class="sub" id="svc-link" hidden style="margin-top:-0.5rem"><a href="#" id="link-room-services" style="color:#FF6B35">→ Shërbime hoteli (bazen, spa, transport…)</a></p>
  <div id="msg" class="sub"></div>
  <div id="menu-shell" class="guest-menu-shell" hidden>
    <div class="menu-group-bar" id="cat-bar"></div>
    <div class="menu-photo-grid" id="menu-grid"></div>
  </div>
  <div id="list">Duke ngarkuar…</div>
  <div class="bar">
    <div class="bar-row" id="contact-row" hidden>
      <input type="text" id="cust-name" maxlength="80" placeholder="Emri (opsional)">
      <input type="tel" id="cust-phone" maxlength="40" placeholder="Telefoni">
    </div>
    <div class="bar-row">
      <strong id="cart-label">Shporta: 0.00 €</strong>
      <button type="button" id="btn-send">Porosit</button>
    </div>
  </div>
  <script src="/js/menu-pos.js"></script>
  <script src="/guest/guest-order-lib.js"></script>
  <script src="/guest/guest-menu-ui.js"></script>
  <script>
    (async () => {
      const G = window.GuestOrder;
      const list = document.getElementById("list");
      const shell = document.getElementById("menu-shell");
      const msg = document.getElementById("msg");
      const cart = G.createCart();
      const sub = document.getElementById("sub");
      const contactRow = document.getElementById("contact-row");

      sub.textContent = G.room
        ? `Room service — ${G.orderModeLabel()} (ushqim/pije)`
        : G.table
          ? `Porosi nga tavolina ${G.orderModeLabel()} — kamarieri e pranon`
          : "Takeaway — porosia shkon te kamarieri për ta pranuar";
      if (G.room) {
        const svcLink = document.getElementById("svc-link");
        const a = document.getElementById("link-room-services");
        if (svcLink && a) {
          svcLink.hidden = false;
          a.href = `/guest/services.html?room=${encodeURIComponent(G.room)}`;
        }
      }
      if (!G.room) contactRow.hidden = false;

      function refreshCart() {
        document.getElementById("cart-label").textContent =
          `Shporta: ${G.fmt(cart.total())} (${cart.count()} artikuj)`;
      }

      try {
        const r = await fetch("/api/guest/menu");
        const d = await r.json();
        if (!r.ok) throw new Error(d.gabim || "Gabim");
        document.getElementById("title").textContent = (d.hotel_name || "Hotel") + " — Menyja";
        list.hidden = true;
        shell.hidden = false;
        GuestMenuUI.renderGuestMenu({
          barEl: document.getElementById("cat-bar"),
          gridEl: document.getElementById("menu-grid"),
          items: d.items || [],
          categories: d.categories || [],
          formatEuro: G.fmt,
          onSelect: (it) => { cart.add(it); refreshCart(); },
        });
      } catch (e) {
        list.innerHTML = `<p class="err">${G.esc(e.message || "Gabim")}</p>`;
      }

      document.getElementById("btn-send").addEventListener("click", async () => {
        msg.className = "sub";
        if (cart.isEmpty()) {
          msg.className = "sub err";
          msg.textContent = "Shtoni artikuj në shportë.";
          return;
        }
        try {
          const result = await G.submitMenuCart(cart, {
            name: document.getElementById("cust-name")?.value?.trim() || "",
            phone: document.getElementById("cust-phone")?.value?.trim() || "",
          });
          cart.clear();
          refreshCart();
          msg.className = "sub ok";
          msg.textContent = result.message
            || (result.pending
              ? "Porosia u dërgua — kamarieri e pranon së shpejti."
              : `Porosia u ruajt (${result.guest_name || ""}, dhoma ${result.room_number || ""}).`);
        } catch (e) {
          msg.className = "sub err";
          msg.textContent = e.message || "Gabim";
        }
      });
    })();
  </script>
</body>
</html>
