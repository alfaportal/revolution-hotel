<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Room Service</title>
  <style>
    :root { --bg:#0f172a; --card:#1e293b; --txt:#f1f5f9; --muted:#94a3b8; --acc:#FF6B35; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--txt); padding:1rem 1rem 5.5rem; }
    h1 { font-size:1.3rem; margin:0 0 0.25rem; }
    .sub { color:var(--muted); margin:0 0 1rem; font-size:0.9rem; }
    .cat { color:var(--acc); font-weight:700; margin:1rem 0 0.4rem; font-size:0.8rem; }
    .item { display:flex; align-items:center; justify-content:space-between; gap:0.75rem; padding:0.6rem 0.7rem; background:var(--card); border-radius:10px; margin-bottom:0.4rem; }
    .item button { background:var(--acc); color:#fff; border:0; border-radius:8px; padding:0.35rem 0.65rem; font-weight:700; cursor:pointer; }
    .bar { position:fixed; left:0; right:0; bottom:0; background:#111827; border-top:1px solid #334155; padding:0.75rem 1rem; display:flex; gap:0.75rem; align-items:center; }
    .bar strong { flex:1; }
    .bar button { background:var(--acc); color:#fff; border:0; border-radius:10px; padding:0.7rem 1rem; font-weight:800; cursor:pointer; }
    .msg { margin:0.5rem 0; font-size:0.9rem; }
    .ok { color:#86efac; } .err { color:#fca5a5; }
  </style>
</head>
<body>
  <h1>Room Service</h1>
  <p class="sub" id="sub">Dhoma —</p>
  <div id="msg" class="msg"></div>
  <div id="list">Duke ngarkuar…</div>
  <div class="bar">
    <strong id="cart-label">Shporta: 0.00 €</strong>
    <button type="button" id="btn-send">Dërgo në dhomë</button>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    const room = String(params.get("room") || "").trim();
    document.getElementById("sub").textContent = room ? `Dhoma ${room}` : "Mungon numri i dhomës në QR";
    const cart = new Map();
    const fmt = (n) => Number(n || 0).toFixed(2) + " €";
    function cartTotal() {
      let t = 0;
      for (const it of cart.values()) t += it.price * it.quantity;
      return t;
    }
    function refreshCart() {
      document.getElementById("cart-label").textContent = `Shporta: ${fmt(cartTotal())} (${[...cart.values()].reduce((s,i)=>s+i.quantity,0)} artikuj)`;
    }
    function addItem(it) {
      const prev = cart.get(it.id) || { ...it, quantity: 0 };
      prev.quantity += 1;
      cart.set(it.id, prev);
      refreshCart();
    }
    (async () => {
      const list = document.getElementById("list");
      if (!room) { list.innerHTML = "<p class='err'>QR i pavlefshëm — mungon dhoma.</p>"; return; }
      try {
        const r = await fetch("/api/guest/menu");
        const d = await r.json();
        if (!r.ok) throw new Error(d.gabim || "Gabim");
        const byCat = {};
        for (const it of d.items || []) {
          const c = it.category || "Të tjera";
          if (!byCat[c]) byCat[c] = [];
          byCat[c].push(it);
        }
        list.innerHTML = Object.keys(byCat).map((c) =>
          `<div class="cat">${c}</div>` +
          byCat[c].map((it) =>
            `<div class="item"><span>${it.name}<br><small style="color:#94a3b8">${fmt(it.price)}</small></span><button type="button" data-id="${it.id}">+</button></div>`
          ).join("")
        ).join("") || "<p class='err'>Nuk ka artikuj.</p>";
        const byId = Object.fromEntries((d.items || []).map((x) => [String(x.id), x]));
        list.querySelectorAll("button[data-id]").forEach((btn) => {
          btn.addEventListener("click", () => {
            const it = byId[btn.getAttribute("data-id")];
            if (it) addItem(it);
          });
        });
      } catch (e) {
        list.innerHTML = `<p class="err">${e.message || "Gabim"}</p>`;
      }
    })();
    document.getElementById("btn-send").addEventListener("click", async () => {
      const msg = document.getElementById("msg");
      const items = [...cart.values()].map((i) => ({
        name: i.name, price: i.price, quantity: i.quantity,
      }));
      if (!items.length) { msg.className = "msg err"; msg.textContent = "Shtoni artikuj në shportë."; return; }
      try {
        const r = await fetch("/api/guest/room-order", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ room_number: room, items }),
        });
        const d = await r.json();
        if (!r.ok) throw new Error(d.gabim || "Dërgimi dështoi");
        cart.clear();
        refreshCart();
        msg.className = "msg ok";
        msg.textContent = `Porosia u shtua te fatura e dhomës ${d.room_number} (${d.guest_name}).`;
      } catch (e) {
        msg.className = "msg err";
        msg.textContent = e.message || "Gabim";
      }
    });
  </script>
</body>
</html>
