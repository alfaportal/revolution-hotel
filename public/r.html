<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="robots" content="index,follow">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Restorant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/r.css?v=15">
  <link rel="stylesheet" href="/css/r-truffle.css?v=1">
  <link rel="stylesheet" href="/css/menu-pos.css?v=16">
  <link rel="apple-touch-icon" id="apple-icon" href="/icons/icon-192.png">
  <script>
    (function () {
      const parts = location.pathname.split("/").filter(Boolean);
      const slug = parts[0] === "r" || parts[0] === "furra" || parts[0] === "hotel" ? parts[1] : "";
      if (!slug) return;
      const link = document.createElement("link");
      link.rel = "manifest";
      link.href = "/r/" + encodeURIComponent(slug) + "/manifest.json";
      document.head.appendChild(link);
    })();
  </script>
</head>
<body>
  <div id="pwa-banner" class="pwa-banner hidden" role="region" aria-label="Instalo aplikacionin">
    <button type="button" class="pwa-banner-close" id="pwa-close" aria-label="Mbyll">×</button>
    <div class="pwa-banner-title">📲 Shto në ekranin kryesor</div>
    <p class="pwa-banner-hint" id="pwa-hint"></p>
    <button type="button" class="pwa-banner-btn hidden" id="pwa-install-btn">Instalo</button>
  </div>

  <div id="screen-loading" class="screen active">
    <div class="loader"></div>
    <p>Duke ngarkuar…</p>
  </div>

  <div id="screen-error" class="screen hidden">
    <div class="error-card">
      <h1>Faqja nuk u gjet</h1>
      <p id="error-msg">Restoranti nuk është i disponueshëm.</p>
    </div>
  </div>

  <div id="screen-main" class="screen hidden">
    <header class="hero" id="hero">
      <img id="hero-cover" class="hero-cover hidden" alt="">
      <div class="hero-overlay" id="hero-overlay"></div>
      <div class="hero-inner">
        <div class="hero-logo-wrap" id="hero-logo-wrap" hidden>
          <img id="hero-logo" class="hero-logo" alt="" width="88" height="88">
        </div>
        <h1 id="biz-name">Restorant</h1>
        <p class="hero-desc" id="biz-desc" hidden></p>
        <a class="hero-cta hidden" id="hero-order-btn" href="#">Porosit tani</a>
      </div>
    </header>

    <div class="daily-offer-banner hidden" id="daily-offer-banner" role="status">
      <span class="daily-offer-icon" aria-hidden="true">🔥</span>
      <span id="daily-offer-text"></span>
    </div>

    <section class="menu-section reveal">
      <h2 class="section-title">Menuja</h2>
      <div class="cat-nav-wrap">
        <nav class="cat-nav" id="cat-nav" aria-label="Kategoritë e menusë"></nav>
        <span class="cat-nav-indicator" id="cat-nav-indicator" aria-hidden="true"></span>
      </div>
      <div id="menu-sections" class="pub-menu-wrap"></div>
    </section>

    <section class="info-section reveal">
      <div class="info-grid">
        <div class="info-card" id="info-address" hidden>
          <span class="info-icon" aria-hidden="true">📍</span>
          <div class="info-address-body">
            <div class="info-label">Adresa</div>
            <div class="info-value" id="val-address"></div>
            <a class="maps-btn" id="btn-maps-address" href="#" target="_blank" rel="noopener noreferrer">
              <span class="maps-btn-icon" aria-hidden="true">🗺️</span>
              Hap në Google Maps
            </a>
          </div>
        </div>
        <div class="info-card" id="info-phone" hidden>
          <span class="info-icon">📞</span>
          <div>
            <div class="info-label">Telefoni</div>
            <a class="info-value info-link" id="val-phone" href="#"></a>
          </div>
        </div>
      </div>
      <div class="hours-card" id="hours-card">
        <div class="hours-title">Orari i punës</div>
        <ul class="hours-list" id="hours-list"></ul>
      </div>
      <div class="contact-actions hidden" id="contact-actions">
        <a class="contact-btn whatsapp-btn hidden" id="btn-whatsapp" href="#" target="_blank" rel="noopener noreferrer">
          <span aria-hidden="true">💬</span> Na kontakto
        </a>
        <div class="social-links hidden" id="social-links"></div>
      </div>
    </section>

    <section class="gallery-section hidden reveal" id="gallery-section">
      <h2 class="section-title">Galeria</h2>
      <div class="gallery-grid" id="gallery-grid"></div>
    </section>

    <section class="reviews-section hidden reveal" id="reviews-section">
      <h2 class="section-title">Vlerësimet e klientëve</h2>
      <div class="reviews-list" id="reviews-list"></div>
    </section>

    <footer style="text-align:center; padding:10px; font-size:12px; color:#888; margin-top:20px;">
      Powered by <a href="https://revolution-pos.com" style="color:#fff; font-weight:bold;">Revolution POS</a>
    </footer>

    <div class="order-bar" id="order-bar" hidden>
      <a class="order-btn" id="btn-order" href="#">Porosit online</a>
    </div>
  </div>

  <div id="menu-photo-lightbox" class="menu-photo-lightbox hidden" role="dialog" aria-modal="true" aria-label="Foto e artikullit">
    <button type="button" class="menu-photo-lightbox-close" id="menu-photo-close" aria-label="Mbyll">×</button>
    <img id="menu-photo-lightbox-img" class="menu-photo-lightbox-img" alt="">
    <div id="menu-photo-lightbox-caption" class="menu-photo-lightbox-caption"></div>
  </div>

  <script src="/js/menuCatalog.js?v=1"></script>
  <script src="/js/menu-pos.js?v=17"></script>
  <script src="/js/r.js?v=17"></script>
</body>
</html>
