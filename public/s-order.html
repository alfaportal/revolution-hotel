<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <title>Porosit online</title>
  <link rel="stylesheet" href="/css/s.css?v=3">
</head>
<body class="order-page">
  <div id="screen-loading" class="screen active">
    <div class="loader"></div>
    <p>Duke ngarkuar…</p>
  </div>

  <div id="screen-error" class="screen hidden">
    <div class="error-card">
      <h1>Nuk u ngarkua</h1>
      <p id="error-msg">Dyqani nuk u gjet.</p>
      <a class="order-back-link" id="error-back" href="#">← Kthehu te dyqani</a>
    </div>
  </div>

  <div id="screen-order" class="screen hidden">
    <header class="order-header">
      <a class="order-back-link" id="back-link" href="#">← Kthehu</a>
      <h1 id="order-title">Porosit online</h1>
      <p class="order-subtitle" id="order-subtitle"></p>
    </header>

    <main class="order-main">
      <section class="order-panel">
        <h2 class="order-panel-title">Të dhënat tuaja</h2>
        <div class="order-type-toggle" role="group" aria-label="Lloji i porosisë">
          <button type="button" class="order-type-btn active" data-type="takeaway">Marrje (Takeaway)</button>
          <button type="button" class="order-type-btn" data-type="delivery">Dërgesë (Delivery)</button>
        </div>
        <label class="order-field">
          <span>Emri *</span>
          <input type="text" id="customer-name" autocomplete="name" placeholder="Emri juaj" required>
        </label>
        <label class="order-field">
          <span>Telefoni *</span>
          <input type="tel" id="customer-phone" autocomplete="tel" placeholder="+383 44 …" required>
        </label>
        <label class="order-field hidden" id="delivery-address-field">
          <span>Adresa e dërgesës *</span>
          <input type="text" id="delivery-address" autocomplete="street-address" placeholder="Rruga, numri, qyteti">
          <button type="button" class="order-maps-btn" id="btn-delivery-maps">🗺️ Hap Maps</button>
        </label>
        <div id="form-error" class="order-form-error hidden"></div>
        <button type="button" class="order-submit-btn" id="btn-submit">Dërgo Porosinë</button>
      </section>

      <section class="order-panel">
        <h2 class="order-panel-title">Shporta</h2>
        <p class="order-cart-count" id="cart-count">0 artikuj</p>
        <ul class="order-cart-lines" id="cart-lines"></ul>
        <div class="order-cart-total-row">
          <span>Totali</span>
          <strong id="cart-total">0.00 €</strong>
        </div>
      </section>

      <section class="order-panel">
        <h2 class="order-panel-title">Produktet</h2>
        <nav class="order-cat-nav" id="order-cat-nav"></nav>
        <div class="order-product-grid" id="order-menu-grid"></div>
      </section>
    </main>
  </div>

  <div id="screen-success" class="screen hidden">
    <div class="success-card">
      <div class="success-icon">✓</div>
      <h1>Porosia u dërgua!</h1>
      <p id="success-msg"></p>
      <a class="order-back-link" id="success-back" href="#">← Kthehu te dyqani</a>
    </div>
  </div>

  <script src="/js/menuCatalog.js"></script>
  <script src="/js/s-order.js?v=2"></script>
</body>
</html>
