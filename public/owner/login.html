<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Hyrje — Revolution POS Pronar</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="RI POS">
  <link rel="manifest" href="/owner/manifest.json">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/css/owner.css">
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="owner-login-brand">
        <div class="owner-login-icon" id="login-icon">🏪</div>
        <h1 id="login-heading">Paneli i pronarit</h1>
        <h2 id="login-biz-name" class="owner-login-biz hidden"></h2>
        <p id="login-sub">Shitjet, raportet dhe tavolinat live — nga telefoni.</p>
        <p class="owner-login-note">Kjo hyrje është vetëm për pronarët. Kamarierët dhe admini POS përdorin aplikacionin në kompjuter.</p>
      </div>
      <div id="login-error" class="alert alert-error hidden"></div>
      <div id="login-info" class="alert alert-ok hidden"></div>

      <form id="form-login" class="owner-auth-form">
        <label for="email">Email i pronarit</label>
        <input type="email" id="email" required autocomplete="username" placeholder="pronari@email.com">
        <label for="password">Fjalëkalimi</label>
        <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••">
        <button type="submit" class="btn btn-primary" style="width:100%;margin-top:0.5rem">Hyr në panel</button>
        <button type="button" id="btn-forgot" class="btn btn-ghost owner-forgot-link">Harrove fjalëkalimin?</button>
        <a href="/owner/register" id="link-owner-register" class="btn btn-ghost owner-forgot-link hidden" style="display:none">Regjistrohu me kod</a>
      </form>

      <form id="form-reset" class="owner-auth-form hidden">
        <p class="owner-reset-hint">Vendos kodin nga email dhe fjalëkalimin e ri (min. 6 karaktere).</p>
        <label for="reset-code">Kodi nga email</label>
        <input type="text" id="reset-code" inputmode="numeric" autocomplete="one-time-code" placeholder="123456">
        <label for="reset-password">Fjalëkalimi i ri</label>
        <input type="password" id="reset-password" autocomplete="new-password" minlength="6" placeholder="min. 6 karaktere">
        <label for="reset-password2">Përsërit fjalëkalimin</label>
        <input type="password" id="reset-password2" autocomplete="new-password" minlength="6" placeholder="••••••••">
        <button type="submit" class="btn btn-primary" style="width:100%;margin-top:0.5rem">Ruaj dhe hyr</button>
        <button type="button" id="btn-back-login" class="btn btn-ghost owner-forgot-link">← Kthehu te hyrja</button>
      </form>
    </div>
  </div>
  <script>
    /* Laptiopi i Ketujemit: fshi cache të vjetër të panelit që bllokonte hyrjen */
    (async function clearStaleOwnerCache() {
      try {
        if ("serviceWorker" in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map((r) => r.unregister()));
        }
        if (window.caches) {
          const keys = await caches.keys();
          await Promise.all(
            keys.filter((k) => k.startsWith("ri-pos-owner")).map((k) => caches.delete(k)),
          );
        }
      } catch (_) { /* ignore */ }
    })();

    const MIN_PASSWORD = 6;
    let mode = "login";

    function clientTypeLabel(tipi) {
      const labels = {
        kafene: "Kafene",
        restorant: "Restorant",
        bar: "Bar",
        market: "Market",
        dyqan: "Dyqan",
        tjeter: "Tjetër",
      };
      return labels[tipi] || "";
    }

    function applyBranding(data) {
      const bizEl = document.getElementById("login-biz-name");
      const subEl = document.getElementById("login-sub");
      const iconEl = document.getElementById("login-icon");
      const name = (data.client_name || "").trim();
      if (!name) {
        bizEl.classList.add("hidden");
        subEl.textContent = "Shitjet, raportet dhe tavolinat live — nga telefoni.";
        return;
      }
      bizEl.textContent = name;
      bizEl.classList.remove("hidden");
      const typeLbl = clientTypeLabel(data.client_type);
      subEl.textContent = typeLbl
        ? `${typeLbl} · shitjet dhe raportet tuaja`
        : "Shitjet, raportet dhe tavolinat live — nga telefoni.";
      if (data.client_type === "kafene") iconEl.textContent = "☕";
      else if (data.client_type === "bar") iconEl.textContent = "🍹";
      else if (data.client_type === "market" || data.client_type === "dyqan") iconEl.textContent = "🛒";
      else if (data.client_type === "restorant") iconEl.textContent = "🍽️";
      else iconEl.textContent = "🏪";
    }

    async function loadBrandingForEmail(email) {
      const e = String(email || "").trim();
      if (!e) return;
      try {
        const res = await fetch(`/api/auth/owner/branding?email=${encodeURIComponent(e)}`);
        const data = await res.json();
        if (data.ok) applyBranding(data);
      } catch { /* ignore */ }
    }

    function hideAlerts() {
      document.getElementById("login-error").classList.add("hidden");
      document.getElementById("login-info").classList.add("hidden");
    }

    function showError(msg) {
      const errEl = document.getElementById("login-error");
      errEl.textContent = msg;
      errEl.classList.remove("hidden");
      document.getElementById("login-info").classList.add("hidden");
    }

    function showInfo(msg) {
      const infoEl = document.getElementById("login-info");
      infoEl.textContent = msg;
      infoEl.classList.remove("hidden");
      document.getElementById("login-error").classList.add("hidden");
    }

    function setMode(next) {
      mode = next;
      document.getElementById("form-login").classList.toggle("hidden", mode !== "login");
      document.getElementById("form-reset").classList.toggle("hidden", mode !== "reset");
      hideAlerts();
    }

    (async () => {
      const token = localStorage.getItem("owner_token");
      if (!token) return;
      try {
        const res = await fetch("/api/auth/owner/me", {
          headers: { Authorization: `Bearer ${token}` },
          credentials: "include",
        });
        if (res.ok) {
          location.href = "/owner/panel";
          return;
        }
        localStorage.removeItem("owner_token");
      } catch {
        localStorage.removeItem("owner_token");
      }
    })();

    (async () => {
      try {
        const res = await fetch("/api/auth/owner/register-config");
        const data = await res.json();
        if (data.registration_enabled) {
          const link = document.getElementById("link-owner-register");
          link.classList.remove("hidden");
          link.style.display = "block";
        }
      } catch { /* ignore */ }
    })();

    (function prefillEmailFromQr() {
      const params = new URLSearchParams(location.search);
      const email = params.get("email");
      if (!email) return;
      const input = document.getElementById("email");
      input.value = email.trim();
      loadBrandingForEmail(email.trim());
      document.getElementById("password").focus();
    })();

    document.getElementById("email").addEventListener("change", e => {
      loadBrandingForEmail(e.target.value);
    });
    document.getElementById("email").addEventListener("blur", e => {
      loadBrandingForEmail(e.target.value);
    });

    document.getElementById("btn-forgot").addEventListener("click", async () => {
      const email = document.getElementById("email").value.trim();
      if (!email) {
        showError("Shkruani emailin e pronarit.");
        return;
      }
      hideAlerts();
      try {
        const res = await fetch("/api/auth/owner/password/forgot", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.gabim || "Gabim");
        setMode("reset");
        showInfo(data.message || "Kontrollo emailin për kodin e rivendosjes.");
      } catch (err) {
        showError(err.message);
      }
    });

    document.getElementById("btn-back-login").addEventListener("click", () => setMode("login"));

    document.getElementById("form-login").addEventListener("submit", async e => {
      e.preventDefault();
      hideAlerts();
      try {
        const res = await fetch("/api/auth/owner/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify({
            email: document.getElementById("email").value.trim().toLowerCase(),
            password: document.getElementById("password").value.trim(),
          }),
        });
        const data = await res.json();
        if (!res.ok) {
          if (data.code === "WRONG_PORTAL") {
            showError(data.gabim || "Ky email nuk është për këtë hyrje.");
            return;
          }
          if (data.code === "PENDING_SETUP") {
            showError(
              "Llogaria nuk është aktivizuar ende. Hapni linkun e ftesës nga emaili (Aktivizo llogarinë), pastaj hyni këtu.",
            );
            return;
          }
          if (data.password_reset_sent || data.code === "PASSWORD_RESET_SENT") {
            setMode("reset");
            showInfo(data.gabim || "Kodi u dërgua në email.");
            return;
          }
          throw new Error(data.gabim || "Gabim");
        }
        localStorage.setItem("owner_token", data.token);
        location.href = "/owner/panel";
      } catch (err) {
        showError(err.message);
      }
    });

    document.getElementById("form-reset").addEventListener("submit", async e => {
      e.preventDefault();
      hideAlerts();
      const email = document.getElementById("email").value.trim();
      const code = document.getElementById("reset-code").value.trim();
      const pw = document.getElementById("reset-password").value;
      const pw2 = document.getElementById("reset-password2").value;
      if (code.length < 4) {
        showError("Vendos kodin nga email.");
        return;
      }
      if (pw.length < MIN_PASSWORD) {
        showError(`Fjalëkalimi min. ${MIN_PASSWORD} karaktere.`);
        return;
      }
      if (pw !== pw2) {
        showError("Fjalëkalimet nuk përputhen.");
        return;
      }
      try {
        const res = await fetch("/api/auth/owner/password/reset", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify({ email, code, new_password: pw }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.gabim || "Gabim");
        localStorage.setItem("owner_token", data.token);
        location.href = "/owner/panel";
      } catch (err) {
        showError(err.message);
      }
    });
  </script>
</body>
</html>
